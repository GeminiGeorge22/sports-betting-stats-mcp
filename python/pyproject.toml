[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sports-betting-stats-mcp"
version = "0.2.0"
description = "Stdio MCP server: sports betting stats: sportsbook odds, player props, scores, xg, closing lines, horse racing via Apify's hosted MCP gateway"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "mcp-server", "apify"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=2.3,<3", "anyio>=4.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sports-betting-stats-mcp = "sports_betting_stats_mcp.server:main"

[project.urls]
Homepage = "https://github.com/GeminiGeorge22/sports-betting-stats-mcp"
Source = "https://github.com/GeminiGeorge22/sports-betting-stats-mcp/tree/main/python"
Issues = "https://github.com/GeminiGeorge22/sports-betting-stats-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sports_betting_stats_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
